const lab=c=>NAMES[ids[c]]||(ids[c]==="Write-in"?"Write-in":"Candidate "+ids[c]);
const sh=c=>NAMES[ids[c]]?NAMES[ids[c]].split(" ").pop():(ids[c]==="Write-in"?"Write-in":ids[c]);
const rows=D.b.split(";").map(s=>{const[a,k]=s.split(":");return{r:[...a].map(x=>parseInt(x,16)),n:+k}});
const m=rows.length,N=rows.map(x=>x.n),TOT=N.reduce((a,b)=>a+b,0);
const SYS=[["plurality","Plurality"],["borda","Borda count"],["copeland","Copeland"],["stv","Ranked choice (STV)"],["veto","Plurality veto"]];
const PRE={"Standard (5-4-3-2-1)":[5,4,3,2,1],"Top-heavy (10-3-1-0-0)":[10,3,1,0,0],"Harmonic (1-½-⅓-¼-⅕)":[1,.5,1/3,.25,.2],"Top two only (1-1-0-0-0)":[1,1,0,0,0]};
let on=Array(n).fill(true),W=[5,4,3,2,1],seed=55,runs=20,sel="plurality",stvR=0,multi=null,R={},FB=[],act=[];
const fmt=x=>Math.round(x*100)/100,f0=x=>Math.round(x).toLocaleString(),pc=(a,b)=>b?(100*a/b).toFixed(1)+"%":"0%";
const argmax=v=>{let b=-1;act.forEach(c=>{if(b<0||v[c]>v[b])b=c});return b};
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function plurality(){const v=Array(n).fill(0);FB.forEach((r,i)=>{if(r.length)v[r[0]]+=N[i]});return{v,w:argmax(v)}}
function borda(){const v=Array(n).fill(0);FB.forEach((r,i)=>r.forEach((c,j)=>v[c]+=N[i]*(W[j]||0)));return{v,w:argmax(v)}}
function copeland(){const M=new Float64Array(n*n);
FB.forEach((r,i)=>{const k=N[i],rk=new Set(r),un=act.filter(c=>!rk.has(c));
r.forEach((a,x)=>{for(let y=x+1;y<r.length;y++)M[a*n+r[y]]+=k;un.forEach(u=>M[a*n+u]+=k)})});
const s=Array(n).fill(0),wins=Array(n).fill(0);
for(const a of act)for(const b of act)if(a<b){const x=M[a*n+b],y=M[b*n+a];if(x>y){s[a]++;wins[a]++}else if(y>x){s[b]++;wins[b]++}else{s[a]+=.5;s[b]+=.5}}
const w=argmax(s),cw=act.find(c=>wins[c]===act.length-1);return{v:s,M,wins,w,cw:cw===undefined?-1:cw}}
function stv(){let al=on.slice(),left=act.length;const rounds=[];
while(true){const v=Array(n).fill(0);let ex=0;
FB.forEach((r,i)=>{const c=r.find(x=>al[x]);if(c===undefined)ex+=N[i];else v[c]+=N[i]});
const a=act.filter(c=>al[c]),tot=a.reduce((s,c)=>s+v[c],0),top=a.reduce((b,c)=>v[c]>v[b]?c:b,a[0]);
if(v[top]*2>tot||a.length===1){rounds.push({v,ex,tot,win:top,al:al.slice()});return{rounds,w:top}}
const lo=Math.min(...a.map(c=>v[c])),el=a.filter(c=>v[c]===lo).sort((x,y)=>ids[x]<ids[y]?-1:1)[0];
rounds.push({v,ex,tot,el,al:al.slice()});al[el]=false}}
let voters=null;
function veto(sd){const rng=mul(sd),sh=Int32Array.from(voters);
for(let i=sh.length-1;i>0;i--){const j=Math.floor(rng()*(i+1)),t=sh[i];sh[i]=sh[j];sh[j]=t}
const al=on.slice(),sc=plurality().v.slice(),el=[];let cnt=act.length;
for(const c of act)if(sc[c]===0){al[c]=false;cnt--;el.push(c)}
for(let k=0;k<sh.length&&cnt>1;k++){const b=sh[k],mk=MK[b];let u=0;
for(const c of act)if(al[c]&&!(mk>>c&1))u++;
let v=-1;
if(u){let t=Math.floor(rng()*u);for(const c of act)if(al[c]&&!(mk>>c&1)){if(t--===0){v=c;break}}}
else{const r=FB[b];for(let j=r.length-1;j>=0;j--)if(al[r[j]]){v=r[j];break}}
if(v<0)continue;if(--sc[v]<=0){al[v]=false;cnt--;el.push(v)}}
const w=cnt===1?act.find(c=>al[c]):-1;if(w>=0)el.push(w);return{el,w}}
let MK=[];
function compute(){act=[...Array(n).keys()].filter(c=>on[c]);
FB=rows.map(x=>x.r.filter(c=>on[c]));MK=FB.map(r=>r.reduce((a,c)=>a|1<<c,0));
voters=new Int32Array(TOT);let p=0;N.forEach((k,i)=>{voters.fill(i,p,p+k);p+=k});
R={plurality:plurality(),borda:borda(),copeland:copeland(),stv:stv(),veto:veto(seed)};multi=null;stvR=R.stv.rounds.length-1;render()}


const PG={
plurality:{lead:"The simplest rule there is: one voter, one vote, and only first choices matter.",
how:["Look at each ballot’s Rank 1 choice and ignore the other four.","Add up first-place votes for every candidate.","The candidate with the most wins, even without a majority."],
watch:["Everything below first place is thrown away, so strong second-choice support counts for nothing.","Similar candidates can split a vote and hand the win to someone most voters like less (the spoiler effect). Try removing a runner-up and see whether the order changes."]},
borda:{lead:"Every position on a ballot earns points, so broad support can beat narrow passion.",
how:["Rank 1 earns 5 points, rank 2 earns 4, down to 1 point for rank 5.","Points are added across all ballots.","The highest total wins. Because every ballot ranks five candidates, nobody is penalized for being left off a short ballot."],
watch:["The result depends on the point scale. Change the weights below and see how much that matters.","Adding or removing a weak candidate can shift the points of everyone else."]},
copeland:{lead:"A round-robin tournament: every candidate faces every other candidate one-on-one.",
how:["For each pair, count ballots that rank one above the other. A ranked candidate beats an unranked one, and ballots ranking neither are skipped.","The pairwise winner earns 1 point (½ each for a tie).","Highest total wins. A candidate who beats everyone is a Condorcet winner."],
watch:["Sometimes no one beats everyone (a cycle), so the title comes down to points and ties are possible.","It only cares who wins each matchup, not by how much. The heatmap shows the margins."]},
stv:{lead:"Ranked-choice voting, the rule New York City uses in primaries, with eliminations until someone has a majority.",
how:["Count each ballot for its highest-ranked candidate still in the race.","If someone has over half of the active ballots, they win.","Otherwise eliminate the last-place candidate and move their ballots to each voter’s next choice. Repeat."],
watch:["Ballots run out when none of their choices remain. Those exhausted ballots drop out of the majority math.","Exact ties for last place are broken by eliminating the smallest candidate ID. Drag the slider to replay each round."]},
veto:{lead:"Instead of voting for someone, each voter vetoes their least-favorite candidate.",
how:["Each candidate starts with a score equal to their first-place votes.","Voters take turns vetoing their lowest-ranked candidate still in the race, which costs that candidate a point.","A candidate at zero is eliminated, and the last one standing wins."],
watch:["The rule needs a full ranking, but NYC voters ranked only five. We place unranked candidates below the ranked ones in random order.","Voter order can change the outcome, so run many shuffles to see if the winner holds."]}};
const MET={plurality:"Plurality",borda:"Borda count",copeland:"Copeland",stv:"Ranked choice (STV)",veto:"Plurality veto"};
let page="home";
function bars(v,o={}){const mx=Math.max(1,...act.map(c=>v[c])),ord=[...act].sort((a,b)=>v[b]-v[a]);
return ord.map(c=>`<div class="row"><span>${lab(c)}</span><div class="track"><div class="fill ${c===o.w?"w":""} ${c===o.x?"x":""} ${LOW(ord,c,o)}" style="width:${100*Math.max(0,v[c])/mx}%"></div></div><span class="v">${o.f?o.f(v[c]):f0(v[c])}</span></div>`).join("")}
function LOW(ord,c,o){if(c===o.w||c===o.x)return"";const p=o.pool?ord.filter(x=>o.pool.includes(x)):ord;return p.length>4&&p.slice(-3).includes(c)?"lo":""}
function legend(k){return`<p class="leg"><span class="sw w" style="margin-left:0"></span>leader<span class="sw lo"></span>bottom three<span class="sw"></span>others${k==="stv"?`<span class="sw x"></span>eliminated this round`:""}</p>`}
function chips(){return`<p class="rm"><b>Select candidates to remove</b><span class="hint">${act.length} of ${n} still in the race</span><button class="go sm" id="rst" ${act.length===n?"disabled":""}>Restore all</button></p><div class="chips">${ids.map((_,c)=>`<button class="chip ${on[c]?"on":"off"}" data-c="${c}" aria-pressed="${!on[c]}">${on[c]?"":"✕ "}${lab(c)}</button>`).join("")}</div>`}
function summ(){const st=R.stv,fr=st.rounds[st.rounds.length-1],co=R.copeland,pl=R.plurality;
return{plurality:[pl.w,`${pc(pl.v[pl.w],TOT)} of first choices`],borda:[R.borda.w,`${fmt(R.borda.v[R.borda.w]).toLocaleString()} points`],
copeland:[co.w,`won ${co.wins[co.w]} of ${act.length-1} matchups${co.cw>=0?" (Condorcet winner)":""}`],stv:[st.w,`round ${st.rounds.length}, ${pc(fr.v[st.w],fr.tot)} of active ballots`],veto:[R.veto.w,R.veto.w>=0?`last standing (seed ${seed})`:"no single winner"]}}
function nav(){return`<nav>${[["home","Home"],...SYS].map(([k,t])=>`<a href="#/${k==="home"?"":k}" class="${page===k?"cur":""}">${t}</a>`).join("")}</nav>`}
function home(){const S=summ(),u=[...new Set(Object.values(S).map(x=>x[0]))].filter(x=>x>=0);
return`<h1>Would a candidate win under any voting rule?</h1>
<p class="sub">We took real ranked ballots from the 2025 NYC Democratic mayoral primary and counted them five different ways. The question: does the same candidate win no matter which rule you pick?</p>
<div class="ban">${u.length===1?`With the current settings, all five rules elect ${lab(u[0])}.`:`With the current settings the rules disagree: ${u.map(lab).join(", ")} each win at least one.`}</div>
<section class="card"><h2>What we did</h2><ol>
<li><b>Collected the ballots.</b> We pulled the city’s cast vote records for the primary. They come as many spreadsheets split by ballot type (early voting, election day, affidavit, emergency, other).</li>
<li><b>Merged them.</b> We kept only each ballot’s five mayoral choices and combined everything into one master file.</li>
<li><b>Filtered to complete ballots.</b> We kept ballots that ranked five different candidates, dropping blanks, overvotes, undervotes, and repeats. That leaves ${f0(TOT)} ballots.</li>
<li><b>Coded five voting rules.</b> Plurality, Borda, Copeland, ranked-choice (STV), and plurality veto, all in Python. The same logic runs on this site.</li>
<li><b>Stress-tested.</b> For plurality veto, whose outcome can depend on voter order, we ran 50 random orderings. The same candidate won all 50.</li></ol></section>
<section class="card"><h2>The ballots</h2><div class="stats"><div class="stat"><b>${f0(TOT)}</b><span>ballots analysed</span></div><div class="stat"><b>${rows.length.toLocaleString()}</b><span>distinct rankings</span></div><div class="stat"><b>${n}</b><span>candidates (incl. write-in)</span></div><div class="stat"><b>5</b><span>ranks per ballot</span></div></div>
<p class="note">Because only full five-candidate ballots are kept, the data skews toward voters who ranked deeply. Results describe this group, not every voter in the city.</p></section>
<section class="card"><h2>Results at a glance</h2><p class="hint">Tap a candidate to remove them and see if anything changes.</p>${chips()}
<table class="res"><tr><th>Rule</th><th>Winner</th><th>Margin</th></tr>${SYS.map(([k,t])=>`<tr><td><a href="#/${k}">${t}</a></td><td class="wn">${S[k][0]>=0?lab(S[k][0]):"None"}</td><td>${S[k][1]}</td></tr>`).join("")}</table></section>
<section class="card"><h2>Explore each rule</h2><div class="grid">${SYS.map(([k,t])=>`<a class="lk" href="#/${k}"><b>${t}</b><small>${PG[k].lead}</small></a>`).join("")}</div></section>
<p class="hint">Candidate names come from the Board of Elections candidate list (CandidacyID to ballot name).</p>`}
function sim(k){
if(k==="plurality"){const v=R.plurality.v,o=[...act].sort((a,b)=>v[b]-v[a]);return bars(v,{w:R.plurality.w,f:x=>f0(x)+" · "+pc(x,TOT)})+`<p class="take">${lab(o[0])} leads ${lab(o[1])} by ${f0(v[o[0]]-v[o[1]])} first-place votes.</p>`}
if(k==="borda")return`<div class="ctl"><label>Scoring preset<select id="pre">${Object.keys(PRE).map(p=>`<option ${JSON.stringify(PRE[p])===JSON.stringify(W)?"selected":""}>${p}</option>`).join("")}</select></label>${W.map((x,i)=>`<label>Rank ${i+1}<input type="number" step="any" class="wi" data-i="${i}" value="${fmt(x)}"></label>`).join("")}</div>`+bars(R.borda.v,{w:R.borda.w,f:x=>fmt(x).toLocaleString()});
if(k==="copeland"){const co=R.copeland,hd=act.map(c=>`<th title="${lab(c)}">${sh(c)}</th>`).join("");
const body=act.map(a=>`<tr><th>${sh(a)}</th>${act.map(b=>{if(a===b)return"<td>·</td>";const d=co.M[a*n+b]-co.M[b*n+a],al=Math.min(.75,Math.abs(d)/TOT*1.3);
return`<td style="background:${d>0?`rgba(26,138,90,${al})`:`rgba(212,69,47,${al})`}">${d>0?"+":""}${(d/1000).toFixed(1)}k</td>`}).join("")}<td><b>${fmt(co.v[a])}</b></td></tr>`).join("");
return`<p class="hint">Net votes for the row candidate over the column candidate. Green means the row wins the matchup.</p><div class="scroll"><table class="hm"><tr><th></th>${hd}<th>Score</th></tr>${body}</table></div><p class="take">${co.cw>=0?`${lab(co.cw)} beats every other candidate one-on-one (a Condorcet winner).`:"No Condorcet winner exists: nobody beats everyone."}</p>`}
if(k==="stv"){const rs=R.stv.rounds;return`<label class="hint" id="rl">Round ${stvR+1} of ${rs.length}</label><input type="range" id="rr" min="0" max="${rs.length-1}" value="${stvR}"><div id="stvb">${stvBars()}</div>`}
const v=R.veto;return`<div class="ctl"><label>Seed<input type="number" id="sd" value="${seed}"></label><label>Shuffles<input type="number" id="rn" min="1" max="200" value="${runs}"></label><button class="go" id="run">Test voter orders</button><span class="hint" id="prog"></span></div>
<b>Elimination order (seed ${seed})</b><ol>${v.el.map((c,i)=>`<li>${lab(c)}${i===v.el.length-1&&v.w>=0?" (winner)":""}</li>`).join("")}</ol>`+(multi?`<p><b>Winners across ${multi.k} voter orders</b></p>`+multi.html:"")}
function stvBars(){const r=R.stv.rounds[stvR];return bars(r.v.map((x,c)=>r.al[c]?x:0),{w:r.win,x:r.el,pool:act.filter(c=>r.al[c]),f:x=>f0(x)+" · "+pc(x,r.tot)})+`<p class="take">${r.win!==undefined?`${lab(r.win)} wins with a majority of active ballots.`:`${lab(r.el)} is eliminated.`} <span class="hint">Exhausted ballots: ${f0(r.ex)}</span></p>`}
function rulePage(k){const P=PG[k],i=SYS.findIndex(s=>s[0]===k),nx=SYS[i+1],pv=SYS[i-1]||["","Home"],S=summ()[k];
return`<h1>${MET[k]}</h1><p class="sub">${P.lead}</p>
<div class="two"><section class="card"><h2>How it works</h2><ol>${P.how.map(x=>`<li>${x}</li>`).join("")}</ol></section><section class="card"><h2>What to watch for</h2><p style="margin-top:0">${P.watch.join("</p><p>")}</p></section></div>
<section class="card"><h2>Simulation</h2><p class="hint" style="margin-top:0">Winner with the current settings: <b class="wn">${S[0]>=0?lab(S[0]):"none"}</b>. Select candidates below to remove them and re-run the count.</p>${chips()}${legend(k)}${sim(k)}</section>
<div class="nextp"><a href="#/${pv[0]}">← ${pv[1]}</a>${nx?`<a href="#/${nx[0]}">${nx[1]} →</a>`:""}</div>`}
function render(){const h=(location.hash||"#/").slice(2);page=h==="home"||PG[h]?h||"home":"home";if(!h)page="home";
document.getElementById("app").innerHTML=nav()+(page==="home"?home():rulePage(page))+`<p class="note">Data: ${f0(TOT)} cast vote records from the NYC Board of Elections that ranked five distinct candidates.</p>`;bind()}
function bind(){const q=s=>document.getElementById(s);
document.querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>{const c=+e.dataset.c;if(on[c]&&act.length<=2)return;on[c]=!on[c];compute()});
if(q("rst"))q("rst").onclick=()=>{on.fill(true);compute()};
if(q("pre"))q("pre").onchange=e=>{W=PRE[e.target.value].slice();compute()};
document.querySelectorAll(".wi").forEach(e=>e.onchange=()=>{W[+e.dataset.i]=parseFloat(e.value)||0;compute()});
if(q("rr"))q("rr").oninput=e=>{stvR=+e.target.value;q("rl").textContent=`Round ${stvR+1} of ${R.stv.rounds.length}`;q("stvb").innerHTML=stvBars()};
if(q("sd"))q("sd").onchange=e=>{seed=parseInt(e.target.value)||0;compute()};
if(q("run"))q("run").onclick=async()=>{runs=Math.min(200,Math.max(1,parseInt(q("rn").value)||20));const cnt={};
for(let i=0;i<runs;i++){q("prog").textContent=`Running ${i+1}/${runs}…`;await new Promise(r=>setTimeout(r));const w=veto(seed+i+1).w;cnt[w]=(cnt[w]||0)+1}
const v=Array(n).fill(0);Object.entries(cnt).forEach(([c,k])=>{if(c>=0)v[c]=k});
multi={k:runs,html:bars(v,{f:x=>x+"/"+runs})+(cnt[-1]?`<p class="hint">${cnt[-1]} runs gave no single winner.</p>`:"")};render()}}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
compute();
</script></body></html>
